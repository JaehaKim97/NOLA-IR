pipeline: pipeline.classification.nola_ir_tpgan.NOLAIRTPGANPipeline
exp_dir: experiments/classification/cub200/009_nola-ir-tpgan
precision: bf16
seed: 123

model:
  sd_path: weights/stable-diffusion-2-1-base
  diffusion:
    start: 200
    num_timesteps: 1
  train_vae: false
  lora:
    rank: 64
    target_modules: [to_k, to_q, to_v, to_out.0, conv, conv1, conv2, conv_shortcut, conv_out, proj_in, proj_out, ff.net.2, ff.net.0.proj]
  res_model:
    target: model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
  cls_model:
    target: model.resnet.ResNet
    params:
      type: 18
      num_classes: 200
    target_layers: ["L4"]
  cls_hq_model:
    weights: weights/ResNet18_CUB200_HQ.pt
  disc:
    target: model.discriminator.ImageConvNextDiscriminator
    params:
      precision: bf16

dataset: configs/classification/cub200/realesrgan_cfg.yaml

train:
  resume:
    res_model: experiments/classification/cub200/002_res-only/checkpoints/res_model_last.pt
    lora_unet: experiments/classification/cub200/008_nola-ir/checkpoints/lora_unet_last.pt
    cls_model: experiments/classification/cub200/008_nola-ir/checkpoints/cls_model_last.pt    
    disc: ~
    strict_load: true
  optimizer:
    nolair:
      type: adamw
      kwargs:
        lr: 5e-5
    cls_model:
      type: SGD
      kwargs:
        lr: 2.5e-3
        momentum: 0.9
        weight_decay: 1e-4
  weight:
    hlf: 1.0
    reg: 0.1
    adv: 0.05
    cls: 1.0
    fm: 1.0
  adv_start: 1000
  batch_size: 32
  train_steps: 10000
  log_every: 100
  ckpt_every: 10000
  image_every: 500
val:
  batch_size: 32
  val_every: 2000
