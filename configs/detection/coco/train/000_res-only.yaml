pipeline: pipeline.detection.res_only.RestorationOnlyPipeline
exp_dir: experiments/detection/coco/000_res-only
precision: bf16
seed: 123

model:
  res_model:
    target: model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
  det_model:
    target: model.faster_rcnn.fasterrcnn_resnet50_fpn_v2
    params:
      weights_backbone: ResNet50_Weights.IMAGENET1K_V2
      num_classes: 91
    target_layers: ["2", "3"]
  det_hq_model:
    weights: weights/FasterRCNN_ResNet50_FPN_V2_Weights_COCO_V1.pt

dataset: configs/detection/coco/realesrgan_cfg.yaml

train:
  resume:
    res_model: weights/codeformer_swinir.ckpt
    det_model: weights/FasterRCNN_ResNet50_FPN_V2_Weights_COCO_V1.pt
    strict_load: true
  optimizer:
    res_model:
      type: AdamW
      kwargs:
        lr: 1e-4
        weight_decay: 0
    det_model: ~
  batch_size: 48
  train_steps: 100000
  log_every: 1000
  ckpt_every: 10000
  image_every: 1000
val:
  resume:
    det_model: weights/FasterRCNN_ResNet50_FPN_V2_Weights_COCO_V1.pt
  batch_size: -1
  val_every: 10000
  calculate_tfd: false
