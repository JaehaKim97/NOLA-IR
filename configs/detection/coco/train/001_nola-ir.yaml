pipeline: pipeline.detection.nola_ir.NOLAIRPipeline
exp_dir: experiments/detection/coco/001_nola-ir
precision: bf16
seed: 123

model:
  sd_path: weights/stable-diffusion-2-1-base
  diffusion:
    start: 200
    num_timesteps: 1
  train_vae: false
  lora:
    rank: 64
    target_modules: [to_k, to_q, to_v, to_out.0, conv, conv1, conv2, conv_shortcut, conv_out, proj_in, proj_out, ff.net.2, ff.net.0.proj]
  res_model:
    target: model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
  det_model:
    target: model.faster_rcnn.fasterrcnn_resnet50_fpn_v2
    params:
      weights_backbone: ResNet50_Weights.IMAGENET1K_V2
      num_classes: 91
    target_layers: ["2", "3"]
  det_hq_model:
    weights: weights/FasterRCNN_ResNet50_FPN_V2_Weights_COCO_V1.pt

dataset: configs/detection/coco/realesrgan_cfg.yaml

train:
  resume:
    res_model: experiments/detection/coco/000_res-only/checkpoints/res_model_last.pt
    det_model: weights/FasterRCNN_ResNet50_FPN_V2_Weights_COCO_V1.pt
    strict_load: true
  optimizer:
    nolair:
      type: adamw
      kwargs:
        lr: 1e-4
    det_model:
      type: SGD
      kwargs:
        lr: 5e-3
        momentum: 0.9
        weight_decay: 1e-4
  weight:
    hlf: 2.0
    det: 1.0
    fm: 0.1
  batch_size: 16
  train_steps: 100000
  log_every: 1000
  ckpt_every: 10000
  image_every: 500
val:
  batch_size: -1
  val_every: 20000
  calculate_tfd: false
