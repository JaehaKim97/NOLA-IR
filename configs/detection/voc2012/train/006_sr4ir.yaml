pipeline: pipeline.detection.sr4ir.SR4IRPipeline
exp_dir: experiments/detection/voc2012/006_sr4ir
precision: bf16
seed: 123

model:
  res_model:
    target: model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
  det_model:
    target: model.faster_rcnn.fasterrcnn_mobilenet_v3_large_fpn
    params:
      weights_backbone: MobileNet_V3_Large_Weights.IMAGENET1K_V1
      num_classes: 21
    target_layers: ["0", "1"]
  det_hq_model:
    weights: weights/FasterRCNN_MobileNetV3_VOC2012_HQ.pt

dataset: configs/detection/voc2012/realesrgan_cfg.yaml

train:
  resume:
    res_model: experiments/detection/voc2012/002_res-only/checkpoints/res_model_last.pt
    det_model: experiments/detection/voc2012/000_hq/checkpoints/det_model_last.pt
    strict_load: true
  optimizer:
    res_model:
      type: AdamW
      kwargs:
        lr: 1e-4
        weight_decay: 0
    det_model:
      type: SGD
      kwargs:
        lr: 5e-3
        momentum: 0.9
        weight_decay: 1e-4
  weight:
    tdp: 1.0
    pix: 1.0
    det: 1.0
  batch_size: 16
  train_steps: 10000
  log_every: 100
  ckpt_every: 10000
  image_every: 1000
val:
  batch_size: -1
  val_every: 2000
